<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игры — выбери игру</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { color-scheme: dark; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 18% 0%, rgba(42, 171, 238, 0.22), transparent 42%),
      radial-gradient(circle at 100% 100%, rgba(255, 154, 158, 0.12), transparent 40%),
      #0e1621;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 430px; }
  .logo {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
    font-size: 34px;
    border-radius: 20px;
    background: linear-gradient(135deg, #2aabee, #1e8fd0);
    box-shadow: 0 10px 30px rgba(42, 171, 238, 0.3);
  }
  h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.5px; }
  .subtitle { margin-top: 8px; color: #8fa3b5; font-size: 15px; line-height: 1.45; }
  .games { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
  .game-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 17px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .game-card:hover { transform: translateY(-2px); border-color: rgba(42, 171, 238, 0.5); }
  .game-card:active { transform: scale(0.985); }
  .game-card::after {
    content: "›";
    margin-left: auto;
    padding-right: 4px;
    font-size: 30px;
    line-height: 1;
    color: #5d7a91;
  }
  .icon {
    flex: 0 0 64px;
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    font-size: 34px;
    border-radius: 18px;
  }
  .snake .icon { background: linear-gradient(135deg, #1e8fd0, #2aabee); }
  .pig .icon { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
  .info { min-width: 0; }
  .info h2 { margin-bottom: 4px; font-size: 19px; }
  .info p { color: #9db0c0; font-size: 13px; line-height: 1.4; }
  .badge {
    display: inline-block;
    margin-bottom: 7px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #9fe0ff;
    background: rgba(42, 171, 238, 0.16);
  }
  .pig .badge { color: #ffc2cb; background: rgba(255, 154, 158, 0.16); }
  .footer { margin-top: 26px; text-align: center; font-size: 12px; color: #526575; }
  @media (max-width: 360px) {
    body { padding: 20px 14px; }
    h1 { font-size: 28px; }
    .game-card { padding: 14px; gap: 13px; }
    .icon { flex-basis: 56px; width: 56px; height: 56px; font-size: 30px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="logo" aria-hidden="true">🎮</div>
  <h1>Выбери игру</h1>
  <p class="subtitle">Две мини-игры в одном месте. Заходи и играй прямо в Telegram.</p>

  <nav class="games" aria-label="Список игр">
    <a class="game-card snake" href="snake.html?play=1">
      <span class="icon" aria-hidden="true">🐍</span>
      <span class="info">
        <span class="badge">Классика</span>
        <h2>Змейка</h2>
        <p>Собирай еду, расти и не врезайся в стены. Стрелки или свайпы.</p>
      </span>
    </a>

    <a class="game-card pig" href="pigjump.html?play=1">
      <span class="icon" aria-hidden="true">🐷</span>
      <span class="info">
        <span class="badge">Аркада</span>
        <h2>Pig Jump</h2>
        <p>Прыгай по платформам всё выше. Кнопки движения и прыжок.</p>
      </span>
    </a>
  </nav>

  <p class="footer">Telegram WebApp Demo</p>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor?.('#0e1621'); } catch (e) {}
  }
</script>
</body>
</html>
