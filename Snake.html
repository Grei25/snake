<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake — Telegram WebApp Demo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #17212b; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; }
  #hud { display: flex; justify-content: space-between; width: 100%; max-width: 400px; padding: 8px 16px; font-size: 18px; font-weight: 600; }
  #canvas { background: #0e1621; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); gap: 16px; }
  #overlay.hidden { display: none; }
  button { background: #2aabee; color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(0.97); }
  #hint { font-size: 13px; opacity: 0.7; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Счёт: <span id="score">0</span></span>
    <span>Рекорд: <span id="best">0</span></span>
  </div>
  <canvas id="canvas" width="360" height="360"></canvas>
  <div id="hint">Свайп или стрелки для управления</div>
</div>

<div id="overlay">
  <h1 style="font-size:28px;">🐍 Змейка</h1>
  <button id="startBtn">Играть</button>
</div>

<script>
  // --- Telegram WebApp ---
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }

  // --- Константы ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const CELL = 20; // размер клетки
  const COLS = canvas.width / CELL;   // 18
  const ROWS = canvas.height / CELL;  // 18

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let snake, dir, nextDir, food, score, best, running, timer, speed;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  // --- Инициализация игры ---
  function initGame() {
    snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 150; // мс на шаг
    scoreEl.textContent = score;
    spawnFood();
    running = true;
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, speed);
    draw();
  }

  // --- Генерация еды ---
  function spawnFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  // --- Шаг игры ---
  function tick() {
    if (!running) return;

    // Применяем поворот
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Проверка столкновения со стенами
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // Проверка столкновения с телом
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    // Съели еду?
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      spawnFood();
      // Ускоряем игру
      if (speed > 70) {
        speed -= 4;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  // --- Отрисовка ---
  function draw() {
    // Фон
    ctx.fillStyle = '#0e1621';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Сетка (лёгкая)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // Еда
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Змейка
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#2aabee' : '#1e8fd0';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      // Глаза на голове
      if (i === 0) {
        ctx.fillStyle = '#fff';
        const ex = s.x * CELL, ey = s.y * CELL;
        const eye = 3;
        if (dir.x === 1) { ctx.fillRect(ex+12, ey+5, eye, eye); ctx.fillRect(ex+12, ey+12, eye, eye); }
        else if (dir.x === -1) { ctx.fillRect(ex+4, ey+5, eye, eye); ctx.fillRect(ex+4, ey+12, eye, eye); }
        else if (dir.y === 1) { ctx.fillRect(ex+5, ey+12, eye, eye); ctx.fillRect(ex+12, ey+12, eye, eye); }
        else { ctx.fillRect(ex+5, ey+4, eye, eye); ctx.fillRect(ex+12, ey+4, eye, eye); }
      }
    });
  }

  // --- Конец игры ---
  function gameOver() {
    running = false;
    clearInterval(timer);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1 style="font-size:28px;">Игра окончена</h1>
      <p style="font-size:20px;">Счёт: <b>${score}</b></p>
      <p style="font-size:16px; opacity:0.8;">Рекорд: ${best}</p>
      <button id="restartBtn">Ещё раз</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', initGame);
  }

  // --- Управление ---
  function setDir(nx, ny) {
    // Нельзя разворачиваться на 180
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
    else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
    else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
    else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
  });

  // Свайпы
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20) setDir(1, 0);
      else if (dx < -20) setDir(-1, 0);
    } else {
      if (dy > 20) setDir(0, 1);
      else if (dy < -20) setDir(0, -1);
    }
    touchStart = null;
  }, { passive: true });

  // Кнопки на экране (для ПК)
  startBtn.addEventListener('click', initGame);
</script>
</body>
</html>
